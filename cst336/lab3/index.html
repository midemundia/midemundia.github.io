<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <title> Sign Up Page </title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
   <link
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>

<body>
  <header>
       <h1> Sign Up </h1>
  </header>
  <hr>
  <div class="main-prompt">
      <u> Please fill out the form below to create an account. </u>
  </div>
  <div class="container p-4">
    <form id="signupForm" action="welcome.html">
     First Name: <input type="text" name="fName"><br><br>
     Last Name: <input type="text" name="lName"><br><br>
     Gender:    
         <input type="radio" name="gender" value="m"> Male
         <input type="radio" name="gender" value="f"> Female<br><br>	
      Zip Code:  <input type="text" id="zip" name="zip">
      <span id="zipError"></span><br>
      City:   <span id="city"></span> <br>
      Latitude:  <span id="latitude"></span><br>
      Longitude: <span id="longitude"></span><br><br>

      State: 
      <select id="state" name="state">
            <option>Select One</option>
            <option value="ca">California</option>
            <option value="ny">New York</option>
	        <option value="tx">Texas</option>
        </select> <br /><br>

        Select a County: <select id="county"></select><br><br>

        <div class="mb-3">
            <label for="username" class="form-label">Desired Username:</label>
            <input type="text" id="username" class="form-control" size="60" style="width: auto;">
            <span id="usernameError"></span>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password:</label>
            <input type="password" id="password" class="form-control" size="60" style="width: auto;">
            <span id="suggestedPwd" class="text-warning"></span>
        </div>
        
        <div class="mb-3">
            <label for="retypePassword" class="form-label">Type Password Again:</label>
            <input type="password" id="retypePassword" class="form-control" size="60" style="width: auto;">
            <span id="passwordError"></span>
        </div>
        
        <input type="submit" value="Sign up!">
    </form>
  </div>
         <script src="js/script.js"></script>

</body>
</html>
